# 姒涙顓婚柊宥囩枂
# 閺堟顕?閼冲矁顕崣锝堫嚔鐠囧嫬鍨?CLI 濡楀棙鐏?

# 闂婃娊顣舵０鍕槱閻炲棝鍘ょ純?
audio:
  sample_rate: 16000          # 闁插洦鐗遍悳鍥风礄Hz閿?
  channels: 1                 # 婢逛即浜鹃弫甯礄mono閿?
  bit_depth: 16               # 娴ｅ秵绻佹惔?

# 闂婃娊顣剁拹銊╁櫤闂冨牆鈧》绱欓悽銊ょ艾 auto 瀵洘鎼搁柅澶嬪閿?
quality_thresholds:
  min_duration_sec: 1.0       # Relaxed duration check
  max_silence_ratio: 0.85     # Allow more silence (User scenario involves pauses)
  min_rms_db: -60             # Allow very quiet audio (previously -28 triggered fallback)
  max_clipping_ratio: 0.1     # 妤傛ü绨銈呪偓鑹邦唶瑜版洝顒熼崨?

# 閸掑棙鏆熻ぐ鎺嶇閸栨牠鍘ょ純?
normalization:
  # GOP 閸掑棙鏆熼弰鐘茬殸閿涘湙OP 閸掑棙鏆熼柅姘埗娑撻缚绀嬮弫甯礉鐡掑﹥甯存潻?0 鐡掑﹤銈介敍?
  gop:
    mode: "sigmoid"            # "linear" 閹?"sigmoid"
    sigmoid:
      k: 1.5                   # 闂勨€虫妱鎼达讣绱濈搾濠傘亣閸栧搫鍨庢惔锕佺Ш妤?
      center: -4.0             # 娑擃厼绺鹃悙鐧哥礉鐎电懓绨?50 閸?
    min: -8.0                 # 鐎电懓绨?0 閸?(缁炬寧鈧勀佸蹇撴礀闁偓閸?
    max: -1.0                 # 鐎电懓绨?100 閸?(缁炬寧鈧勀佸蹇撴礀闁偓閸?
  
  # 濞翠礁鍩勬惔锕侇吀缁犳娼堥柌?
  fluency:
    silence_penalty_weight: 50  # silence_ratio 濮ｅ繐顤冮崝?0.1 閹碉絽顦跨亸鎴濆瀻
    pause_penalty_weight: 40    # 瀵倸鐖堕崑婊堛€戝В蹇旑偧閹碉絽顦跨亸鎴濆瀻 (娑斿澧犳稉?20閿涘苯濮為崐宥嗗劦缂?
  
  # 鐠囶叀鐨熺拠鍕瀻閿涘牏鐣濋崠鏍ㄦ煙濡楀牞绱?
  intonation:
    energy_variance_weight: 0.5  # 閼充粙鍣洪崣妯哄鐠愶紕灏為弶鍐櫢

# 閸掑棙鐎藉Ο鈥虫健闁板秶鐤?
analysis:
  weak_words_top_n: 3         # 閸欐牕鍨庨弫鐗堟付娴ｅ海娈?N 娑擃亣鐦?
  weak_phonemes_top_n: 2      # 閸欐牕鍨庨弫鐗堟付娴ｅ海娈?N 娑擃亪鐓剁槐?
  confusions_top_n: 2         # 閸欐牗璐╁ǎ鍡橆偧閺佺増娓舵径姘辨畱 N 鐎?
  
  # 閺嶅洨顒烽梼鍫濃偓?
  word_thresholds:
    ok: 65                    # Matches Rubric [65-100] Good
    weak: 40                  # Matches Rubric [41-69] Weak
  
  phoneme_thresholds:
    ok: 75
    weak: 45
  pause_diagnostics:
    child_voice_mode: true      # Kid-first timing tolerance and evidence filtering
# 閸ョ偤鈧偓缁涙牜鏆愰柊宥囩枂
fallback:
  max_missing_words_ratio: 0.25  # 鐡掑懓绻冨銈嗙槷娓氬袝閸欐垵娲栭柅鈧?
  retry_count: 1                  # 閺堚偓婢堆囧櫢鐠囨洘顐奸弫?

# HTML 閹躲儱鎲￠柊宥囩枂
report:
  colors:
    ok: "#111111"             # 閺嬩椒绗撴稉姘剁拨閼?
    weak: "#FF8C00"           # 闁辨帞娲伴惃鍕煻閼?
    missing: "#EF4444"        # 缁俱垼澹?
    poor: "#EF4444"           # 缁俱垼澹?
  
  show_audio_player: true     # 閺勵垰鎯侀弰鍓с仛闂婃娊顣堕幘顓熸杹閸?
  show_phoneme_details: true  # 閺勵垰鎯侀弰鍓с仛闂婂磭绀岀痪褍鍩嗙拠锔藉剰

# 瀵洘鎼搁柊宥囩枂
