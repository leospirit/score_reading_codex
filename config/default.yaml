  provider: "openai"        # 閺呴缚姘ㄦ稊鐔峰悑鐎?openai 閸楀繗顔?
  base_url: "https://open.bigmodel.cn/api/paas/v4/" # 閺呴缚姘ㄦ妯款吇閸︽澘娼?
