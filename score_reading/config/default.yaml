# 榛樿閰嶇疆
# 鏈楄/鑳岃鍙ｈ璇勫垎 CLI 妗嗘灦

# 闊抽棰勫鐞嗛厤缃?
audio:
  sample_rate: 16000          # 閲囨牱鐜囷紙Hz锛?
  channels: 1                 # 澹伴亾鏁帮紙mono锛?
  bit_depth: 16               # 浣嶆繁搴?

# 闊抽璐ㄩ噺闃堝€硷紙鐢ㄤ簬 auto 寮曟搸閫夋嫨锛?
quality_thresholds:
  min_duration_sec: 1.0       # Relaxed duration check
  max_silence_ratio: 0.85     # Allow more silence (User scenario involves pauses)
  min_rms_db: -60             # Allow very quiet audio (previously -28 triggered fallback)
  max_clipping_ratio: 0.1     # 楂樹簬姝ゅ€艰褰曡鍛?

# 鍒嗘暟褰掍竴鍖栭厤缃?
normalization:
  # GOP 鍒嗘暟鏄犲皠锛圙OP 鍒嗘暟閫氬父涓鸿礋鏁帮紝瓒婃帴杩?0 瓒婂ソ锛?
  gop:
    mode: "sigmoid"            # "linear" 鎴?"sigmoid"
    sigmoid:
      k: 1.5                   # 闄″抄搴︼紝瓒婂ぇ鍖哄垎搴﹁秺楂?
      center: -4.0             # 涓績鐐癸紝瀵瑰簲 50 鍒?
    min: -8.0                 # 瀵瑰簲 0 鍒?(绾挎€фā寮忓洖閫€鍊?
    max: -1.0                 # 瀵瑰簲 100 鍒?(绾挎€фā寮忓洖閫€鍊?
  
  # 娴佸埄搴﹁绠楁潈閲?
  fluency:
    silence_penalty_weight: 50  # silence_ratio 姣忓鍔?0.1 鎵ｅ灏戝垎
    pause_penalty_weight: 40    # 寮傚父鍋滈】姣忔鎵ｅ灏戝垎 (涔嬪墠涓?20锛屽姞鍊嶆儵缃?
  
  # 璇皟璇勫垎锛堢畝鍖栨柟妗堬級
  intonation:
    energy_variance_weight: 0.5  # 鑳介噺鍙樺寲璐＄尞鏉冮噸

# 鍒嗘瀽妯″潡閰嶇疆
analysis:
  weak_words_top_n: 3         # 鍙栧垎鏁版渶浣庣殑 N 涓瘝
  weak_phonemes_top_n: 2      # 鍙栧垎鏁版渶浣庣殑 N 涓煶绱?
  confusions_top_n: 2         # 鍙栨贩娣嗘鏁版渶澶氱殑 N 瀵?
  
  # 鏍囩闃堝€?
  word_thresholds:
    ok: 70                    # Matches Rubric [70-100] Good
    weak: 40                  # Matches Rubric [41-69] Weak
  
  phoneme_thresholds:
    ok: 75
    weak: 45
  missing_debug:
    enabled: false
    path: "data/diagnostics/missing_debug.jsonl"
    max_script_chars: 360
    max_transcript_chars: 360

# 鍥為€€绛栫暐閰嶇疆
fallback:
  max_missing_words_ratio: 0.25  # 瓒呰繃姝ゆ瘮渚嬭Е鍙戝洖閫€
  retry_count: 1                  # 鏈€澶ч噸璇曟鏁?

# HTML 鎶ュ憡閰嶇疆
report:
  colors:
    ok: "#111111"             # 鏋佷笓涓氶粦鑹?
    weak: "#FF8C00"           # 閱掔洰鐨勬鑹?
    missing: "#EF4444"        # 绾㈣壊
    poor: "#EF4444"           # 绾㈣壊
  
  show_audio_player: true     # 鏄惁鏄剧ず闊抽鎾斁鍣?
  show_phoneme_details: true  # 鏄惁鏄剧ず闊崇礌绾у埆璇︽儏

# 寮曟搸閰嶇疆
engines:
  
  wav2vec2:
    model: "facebook/wav2vec2-base-960h" # Default English model
    device: "auto"                       # "cpu", "cuda", or "auto"
  
  fast:
    service_url: "http://gentle:8765"
    timeout_sec: 120          # 澧炲姞瓒呮椂瀹瑰繊搴?
  
  pro:
    enabled: true             # 鍚敤 AI 澧炲己寮曟搸
    prefer_pro_mode: true     # 榛樿浼樺厛浣跨敤 PRO 妯″紡 (Azure > 鏈湴 Pro)
    model_size: "base"        # Whisper 妯″瀷澶у皬
  
  azure:
    api_key: ""               # 蹇呭～锛氭偍鐨?Azure Speech API Key
    region: "eastus"          # 鎮ㄧ殑 Azure 鍖哄煙 (渚嬪: eastus, japaneast)
    language: "en-US"         # 璇勬祴璇█
  
  gemini:
    api_key: ""               # 鐢ㄤ簬銆愯闊虫儕鍠滆瘑鍒€?Multimodal Audio)
    model: "gemini-3-flash-preview"
    alignment_source: "gop"    # Options: "whisper", "gop"
    reference_wait_sec: 1.2     # Max blocking wait for cached script reference

# AI 鑰佸笀閰嶇疆 (鏀寔 OpenAI / Zhipu GLM)
llm:
  api_key: ""               # 鐢ㄤ簬銆怉I 鑰佸笀鐐硅瘎銆?Text Advisor) - 濉叆鏅鸿氨 Key (id.secret)
  provider: "openai"        # 鏅鸿氨涔熷吋瀹?openai 鍗忚
  base_url: "https://open.bigmodel.cn/api/paas/v4/" # 鏅鸿氨榛樿鍦板潃
  model: "glm-4-flash"

# 骞跺彂閰嶇疆
concurrency:
  default_jobs: 1             # 榛樿骞跺彂鏁?  max_jobs: 16                # 鏈€澶у苟鍙戞暟
